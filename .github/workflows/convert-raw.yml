name: Convert RAW images

on:
  workflow_dispatch:
  push: {}
  schedule:
    - cron: '0 */4 * * *'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build converter image
        run: docker build -t rawtojpg-converter .

      - name: Convert RAW files
        run: docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace" rawtojpg-converter

      - name: Upload JPG files
        uses: actions/upload-artifact@v4
        with:
          name: converted-jpg
          path: '**/*.jpg'
          if-no-files-found: warn